<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <form>
        
        <h1 class="top-panel-login">Login</h1>
        <h1 class="top-panel-Reg">Register</h1>
        <h1 class="upper-registration">|</h1>
        <p class="navigation-before-registration">Enter your email and password to register.</p>
        <div class="registration-fields">
            <input placeholder="Username" type="text">
            <input placeholder="Enter your email address" type="email">
            <input placeholder="Password" type="password">
            <input placeholder="Confirm Password" type="password">
        </div>
        <button class="button-registration" type="button">Register</button>
        <p class="registration-navigator-through-google">Or register with</p>
        <div class="registration-buttons">
            <a href="" class="button">Continue with Google</a>
            <a href="" class="button">Continue with Facebook</a>
        </div>
    </form>
</body>
</html>
