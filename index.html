<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div>
        <div class="blok-register">
            <a class="button-login" href="">Login</a>
            <span><img src="./img/I.svg" alt=""></span>
            <a class="button-reg" href="">Register</a>
        </div>
        <p class="navigation-before-registration">Enter your email and password to register.</p>
        <div class="input-register">
           <div>
                 <input placeholder="Username" type="text">
            <div>
                <input placeholder="Enter your email address" type="email">
            </div>
            <div>
                <input placeholder="Password" type="password">
            </div>
            <div>
                <input placeholder="Confirm Password" type="password">  
            </div>
            <div>
                <button class="button-registration" type="button">Register</button>
                <p class="registration-navigator-through-google">Or register with</p>
            </div>
            <div class="box-google-facebook">
                <div class="button-registration-google">
                <button><a href="" class="button">Continue with Google</a></button>
            </div>
            <div class="button-registration-facebook">
                <button><a href="" class="button">Continue with Facebook</a></button>
            </div>
        </div>
    </div>
</body>
</html>
